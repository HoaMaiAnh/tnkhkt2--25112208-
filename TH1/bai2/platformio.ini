; PlatformIO Project Configuration File
;
; BAI 2 - QUAN SAT HIEN TUONG NAY PHIM (BOUNCING) & CHONG DOI (DEBOUNCE)
; Cung mot mach voi bai 1 (nut nhan GPIO4 + LED GPIO2), 2 vi du:
;
;   [env:vd1_no_debounce]  -> src/vd1_no_debounce.cpp
;       ISR dem moi suon xuong, KHONG chong doi -> quan sat hien tuong nay
;       bang Serial Plotter (nhay nut 1 lan se thay nhieu xung/nhieu lan dem).
;
;   [env:vd2_debounce]     -> src/vd2_debounce.cpp
;       ISR co chong doi bang millis() (cua so 50ms) -> nhay nut 1 lan chi
;       dem dung 1 lan, so sanh truc tiep voi vi du 1.
;
; Cach build & nap tung vi du (chon 1 trong 2 lenh):
;   pio run -e vd1_no_debounce -t upload
;   pio run -e vd2_debounce    -t upload
;
; Sau khi nap, mo Serial Plotter / Serial Monitor (115200 baud) de quan sat.

[platformio]
default_envs = vd1_no_debounce

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = time

; Neu cong COM khong tu nhan, mo comment va sua lai COMx cho dung
; upload_port = COM7
; monitor_port = COM7

[env:vd1_no_debounce]
build_src_filter = +<vd1_no_debounce.cpp>

[env:vd2_debounce]
build_src_filter = +<vd2_debounce.cpp>
