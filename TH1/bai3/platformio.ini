; PlatformIO Project Configuration File
;
; BAI 3 - ADC + LOC NHIEU + LEDC, va TEST ADC1 vs ADC2 (strapping pin)
;
;   [env:vd1_adc1_loc_ledc]   -> src/vd1_adc1_loc_ledc.cpp
;       Mach chuan: bien tro -> GPIO34 (ADC1), LED -> GPIO18 (LEDC).
;       Doc tho -> loc trung binh truot (N=8) -> xuat PWM phan cung.
;
;   [env:vd2_adc2_strapping]  -> src/vd2_adc2_strapping.cpp
;       Mach TEST (chi de hoc, KHONG dung that): bien tro -> GPIO12
;       (ADC2 + strapping pin MTDI). Cho thay 2 hau qua: loi boot khi
;       bien tro keo sai muc luc cap nguon, va doc sai/hang khi Wi-Fi bat.
;
; Cach build & nap tung vi du (chon 1 trong 2 lenh):
;   pio run -e vd1_adc1_loc_ledc  -t upload
;   pio run -e vd2_adc2_strapping -t upload
;
; Sau khi nap, dung script python ../bai3/plot_serial_vd3.py COMx de
; quan sat truc quan (2 so lon + do thi tho/loc theo thoi gian).

[platformio]
default_envs = vd1_adc1_loc_ledc

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = time

; Neu cong COM khong tu nhan, mo comment va sua lai COMx cho dung
; upload_port = COM7
; monitor_port = COM7

[env:vd1_adc1_loc_ledc]
build_src_filter = +<vd1_adc1_loc_ledc.cpp>

[env:vd2_adc2_strapping]
build_src_filter = +<vd2_adc2_strapping.cpp>
